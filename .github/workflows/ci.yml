name: lint

# Repo hygiene gate. tartci is shell + python + TOML, so the failure mode is a
# syntax slip in a script that only surfaces at run time on a CI host (e.g. a
# help line that ran as a command before `set -e`). `scripts/lint.sh` — the
# same script contributors run locally — catches that class before merge.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure shellcheck
        run: command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }

      - name: Show tool versions
        run: |
          bash --version | head -1
          shellcheck --version | sed -n '1,2p'
          python3 --version

      - name: Run repo lint (shellcheck + bash -n + py_compile + TOML parse)
        run: ./scripts/lint.sh

      - name: Match the macOS launch-interpreter contract
        shell: bash
        run: |
          set -euo pipefail
          if [[ -L /usr/bin/python3 ]]; then
            source_python="$(readlink -f /usr/bin/python3)"
            sudo cp --remove-destination "$source_python" /usr/bin/python3
          fi
          test -f /usr/bin/python3
          test ! -L /usr/bin/python3
          /usr/bin/python3 --version

      - name: Run unit tests
        # lint.sh only py_compiles the test files; actually EXECUTE the
        # behavioral suites so a regression in e.g. the idle-gate subset
        # matcher (scripts/test_idle_gate.py) or runtime_measure fails CI.
        # These tests are gh/tart-free (they extract+run pure snippets or call
        # the python-only CLI), so they run on the ubuntu lint host.
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Run shell tests
        run: |
          for test_script in tests/test_*.sh; do
            # Name the script: several end on a bare assertion under errexit.
            bash "$test_script" || { rc=$?; echo "::error::$test_script exited $rc"; exit 1; }
          done

  python-39-tests:
    # The fleet's system interpreter is /usr/bin/python3 3.9.6 on all four
    # hosts (m1, m3, m5, m5studio): the tartci shim's support-manifest check,
    # the pinned launch interpreter, explicit /usr/bin/python3 call sites and
    # every tartci_toml_exec_or_python3 fallback on a host without a tomllib
    # Python run on it. python-floor only compiles under 3.11 and the lint job
    # runs the tests on ubuntu's 3.12+, so a 3.9-only failure reached a PR four
    # times on 2026-10-05. setup-python has no 3.9.6 for current ubuntu images,
    # so this runs the newest 3.9 (same language, same stdlib surface, no
    # tomllib) on the lint job's OS, and puts it first on PATH so subprocesses
    # that call `python3` get it too. A test that genuinely needs tomllib says
    # so (scripts/testing_support.py) and is skipped rather than failing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Refuse anything but a 3.9 interpreter on PATH
        run: |
          set -euo pipefail
          python3 -c 'import sys; v = sys.version_info[:2]; print(sys.version); raise SystemExit(0 if v == (3, 9) else 1)'
          if python3 -c 'import tomllib' 2>/dev/null; then
            echo "python3 imports tomllib; this job must run a tomllib-less 3.9" >&2
            exit 1
          fi
      - name: Run the unit tests under Python 3.9 (the hosts' /usr/bin/python3)
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  python-floor:
    # Fleet hosts run these scripts under their own Homebrew python3, and the
    # oldest one in service is 3.11 (the tomllib floor). The lint job's
    # ubuntu-latest python accepts 3.12+ syntax (PEP 701 nested f-string
    # quotes) that 3.11 rejects at import, so compile under the floor itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile every tracked Python file under Python 3.11
        run: |
          python --version
          git ls-files -z '*.py' | xargs -0 python -m py_compile

  probe-macos15:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers; /usr/bin/python3 --version; echo "TMPDIR=$TMPDIR"
      - run: /usr/bin/python3 scripts/probe_rename_macos15.py
      - run: /usr/bin/python3 -m unittest -v test_tartci_support_manifest.TartciSupportManifestTests.test_stage_install_is_immutable_reusable_and_refuses_dirty_source test_disk_reclaim.ClassifyTests.test_empty_pgrep_result_is_an_answer_not_a_failure
        working-directory: scripts
        continue-on-error: true
      - run: TMPDIR=$RUNNER_TEMP /usr/bin/python3 scripts/probe_rename_macos15.py
      - run: TMPDIR=$RUNNER_TEMP /usr/bin/python3 -m unittest -v test_tartci_support_manifest.TartciSupportManifestTests.test_stage_install_is_immutable_reusable_and_refuses_dirty_source
        working-directory: scripts
        continue-on-error: true
