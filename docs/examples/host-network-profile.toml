# Copy only to a host whose direct GitHub TLS path was measured unreliable:
#   ~/.config/tartci/network-profile.toml
schema_version = 1

[http_connect_relay]
enabled = true
relay_hosts = ["macmini", "m1"]
github_cli = "ghapp"
# Required for enabled profiles. This is both the repository probe target and
# the explicit ghapp authority exported as SHIPYARD_GH_APP_REPO / GH_REPO.
github_probe_repo = "Generous-Corp/pulp"
probe_timeout_seconds = 15
