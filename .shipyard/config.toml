# Shipyard settings this repository's base branch carries.

[auto_merge]
# Who may sign the fleet App's `verdict: APPROVE`: an approval posted through
# ghapp counts only with a `reviewer: <name>` line naming one of these. This
# list beats any host's reviewer-signers.json. `shipyard review-verdict` and
# the `review-verdict` status read only this list, never a host file, and
# refuse every App approval in a review-required repository that has none.
reviewer_signers = ["pulp-review", "infra-review2"]

[validation]
# TartCI has no repository skill-sync or version-bump gates. Declare that
# boundary explicitly so Shipyard does not mistake absent scripts for a valid
# pass or require placeholder gates.
pr_gates = false

[targets.github-lint]
# GitHub Actions owns TartCI's required CI checks. Keep the optional Shipyard
# cloud target available for an explicit dispatch without making Shipyard
# duplicate or replace the repository's pull-request checks.
backend = "cloud"
platform = "linux-x64"
workflow = "ci.yml"
default = false
