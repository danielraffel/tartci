# Profile: normal-local-fast
#
# PR: checks that run for pull requests, workflow_dispatch PR validation, and
#     regular fast feedback.
# Release: conservative release workflows. These may intentionally use fewer
#     local fallbacks than PR checks.
# Coverage: coverage-producing jobs. Use clean ephemeral runners; do not route
#     coverage to warm bare-metal build pools.
# Scheduled: periodic validation on main. This is the right place for slower
#     GitHub-hosted Intel Linux/Windows checks.
# issue_on_failure: for scheduled/main jobs, create or update a deduped issue
#     with run URL, commit, lane, failing step, and error signature.
#
# Target IDs below are tartci/Shipyard vocabulary. They are not GitHub labels.
# The [targets.*] catalog maps each target to the exact GitHub `runs-on` selector
# that Pulp workflows receive after Shipyard/tartci planning chooses a concrete
# route.

name = "normal-local-fast"
description = "Fast PRs on local disposable ARM64 and Mac Pro Linux x64 capacity with hosted fallback."

# Fleet-wide naming posture: target IDs and host/lane/slot IDs are stable
# operator vocabulary. GitHub registration names are unique per boot for every
# disposable worker; static names are forbidden because a dead registration
# can collide with its replacement. Supervisors reclaim only offline
# registrations from their own slot before registering a new worker.
[naming]
target_id = "stable"
host_id = "stable"
lane_id = "stable"
slot_id = "stable"
github_registration = "ephemeral-per-boot"
reclaim_scope = "offline-own-slot-only"

# Every workflow class is explicit. New repositories must add their own
# [repo."OWNER/REPO"] policy before local routing is enabled; an absent policy
# is hosted-only, never an implicit local route.
[policy]
required_gate = "local-first-with-hosted-fallback"
debug = "local-first-with-hosted-fallback"
release_build = "local-first-with-hosted-fallback"
release_signing = "github-only"
release_deploy = "github-only"
coverage = "clean-ephemeral-only"
scheduled_authoritative = "github-hosted"
privileged = "github-only"
fork = "github-only"
untrusted = "github-only"
secret_bearing = "github-only"
unsupported_architecture = "github-only"

[repo."Generous-Corp/pulp".pr.macos]
strategy = "ordered-fallback"
targets = ["macstudio.macos-arm64-vm", "m5.macos-arm64-vm", "github.macos-arm64"]
github_variable = "PULP_LOCAL_MACOS_RUNS_ON_JSON"

[repo."Generous-Corp/pulp".pr.linux]
strategy = "ordered-fallback"
targets = ["macpro.linux-x64-pr-safe-vm", "github.linux-x64"]
health_lease_variable = "PULP_PR_SAFE_LINUX_LEASE_UNTIL"
health_lease_ttl_seconds = 300
health_lease_events = ["pull_request"]
health_lease_runner_name_prefix = "pulp-pr-safe-ephemeral-"
health_lease_min_idle = 1
github_variable = "PULP_PR_SAFE_LINUX_RUNS_ON_JSON"

[repo."Generous-Corp/pulp".merge_group.linux]
strategy = "ordered-fallback"
targets = ["macpro.linux-x64-trusted-vm", "github.linux-x64"]
health_lease_variable = "PULP_LOCAL_LINUX_LEASE_UNTIL"
health_lease_ttl_seconds = 300
health_lease_events = ["merge_group"]
health_lease_runner_name_prefix = "pulp-ci-ephemeral-"
health_lease_min_idle = 1
github_variable = "PULP_LOCAL_LINUX_RUNS_ON_JSON"

[repo."Generous-Corp/pulp".debug.linux]
strategy = "ordered-fallback"
targets = ["macpro.linux-x64-pr-safe-vm", "github.linux-x64"]
health_lease_variable = "PULP_PR_SAFE_LINUX_LEASE_UNTIL"
health_lease_ttl_seconds = 300
github_variable = "PULP_LOCAL_LINUX_DEBUG_RUNS_ON_JSON"

[repo."Generous-Corp/pulp".pr.windows]
strategy = "ordered-fallback"
targets = ["macstudio.windows-arm64-qemu", "github.windows-x64"]
github_variable = "PULP_LOCAL_WINDOWS_RUNS_ON_JSON"

[repo."Generous-Corp/pulp".release.macos]
strategy = "ordered-fallback"
targets = ["macstudio.macos-arm64-release-vm", "github.macos-arm64"]
github_variable = "PULP_RELEASE_MACOS_RUNS_ON_JSON"

[repo."Generous-Corp/pulp".release.linux]
strategy = "github-only"
targets = ["github.linux-x64"]
github_variable = "PULP_RELEASE_LINUX_BUILD_RUNS_ON_JSON"

[repo."Generous-Corp/pulp".release.signing]
strategy = "github-only"
targets = ["github.linux-x64"]
github_variable = "PULP_RELEASE_SIGNING_RUNS_ON_JSON"

[repo."Generous-Corp/pulp".release.deploy]
strategy = "github-only"
targets = ["github.linux-x64"]
github_variable = "PULP_RELEASE_DEPLOY_RUNS_ON_JSON"

[repo."Generous-Corp/pulp".coverage.macos]
strategy = "ordered-fallback"
targets = ["macstudio.macos-arm64-coverage-vm", "github.macos-arm64"]
github_variable = "PULP_COVERAGE_MACOS_RUNS_ON_JSON"
ephemeral_required = true

[repo."Generous-Corp/pulp".coverage.windows]
strategy = "github-only"
targets = ["github.windows-x64"]
github_variable = "PULP_COVERAGE_WINDOWS_RUNS_ON_JSON"

[repo."Generous-Corp/pulp".scheduled.nightly_intel]
enabled = true
branch = "main"
targets = ["macmini.macos-intel-native", "github.macos-intel"]
issue_on_failure = true

# Vellum uses the same capability-first vocabulary, but has its own repository
# groups/labels and does not inherit Pulp's trust boundary. These entries are
# planning contracts until a Vellum-scoped registration token, golden proof,
# and teardown audit exist on the target host.
[repo."Generous-Corp/vellum".pr.linux]
strategy = "ordered-fallback"
targets = ["macpro.vellum-linux-x64-pr-safe", "github.linux-x64"]
health_lease_variable = "VELLUM_PR_SAFE_LINUX_LEASE_UNTIL"
health_lease_ttl_seconds = 300
health_lease_events = ["pull_request"]
health_lease_runner_name_prefix = "vellum-pr-safe-ephemeral-"
health_lease_min_idle = 1
github_variable = "VELLUM_PR_SAFE_LINUX_RUNS_ON_JSON"

[repo."Generous-Corp/vellum".pr.macos]
strategy = "ordered-fallback"
targets = [
  "m3.vellum-macos-arm64-vm",
  "m5.vellum-macos-arm64-vm",
  "m1.vellum-macos-arm64-vm",
  "github.macos-arm64",
]
health_lease_variable = "VELLUM_PR_MACOS_LEASE_UNTIL"
health_lease_ttl_seconds = 300
health_lease_events = ["pull_request", "workflow_dispatch"]
health_lease_runner_name_prefix = "vellum-macos-ephemeral-"
health_lease_min_idle = 1
github_variable = "VELLUM_PR_MACOS_RUNS_ON_JSON"

[repo."Generous-Corp/vellum".pr.windows]
strategy = "ordered-fallback"
targets = ["macpro.vellum-windows-x64-qemu", "github.windows-x64"]
health_lease_variable = "VELLUM_PR_WINDOWS_LEASE_UNTIL"
health_lease_ttl_seconds = 300
health_lease_events = ["pull_request", "workflow_dispatch"]
health_lease_runner_name_prefix = "vellum-windows-ephemeral-"
health_lease_min_idle = 1
github_variable = "VELLUM_PR_WINDOWS_RUNS_ON_JSON"

# Build-only release preparation may use a disposable local build, but signing,
# publication, authority, and deployment remain hosted/trusted.
[repo."Generous-Corp/vellum".release.macos_build]
strategy = "ordered-fallback"
targets = [
  "m3.vellum-macos-arm64-release-vm",
  "m5.vellum-macos-arm64-release-vm",
  "m1.vellum-macos-arm64-release-vm",
  "github.macos-arm64",
]
github_variable = "VELLUM_RELEASE_BUILD_MACOS_RUNS_ON_JSON"

[repo."Generous-Corp/vellum".release.linux_build]
strategy = "ordered-fallback"
targets = ["macpro.vellum-linux-x64-release", "github.linux-x64"]
github_variable = "VELLUM_RELEASE_BUILD_LINUX_RUNS_ON_JSON"

[repo."Generous-Corp/vellum".release.signing]
strategy = "github-only"
targets = ["github.linux-x64"]
github_variable = "VELLUM_RELEASE_SIGNING_RUNS_ON_JSON"

[repo."Generous-Corp/vellum".release.deploy]
strategy = "github-only"
targets = ["github.linux-x64"]
github_variable = "VELLUM_RELEASE_DEPLOY_RUNS_ON_JSON"

[repo."Generous-Corp/vellum".scheduled.nightly_intel]
enabled = true
branch = "main"
targets = ["macmini.vellum-macos-intel-native", "github.macos-intel"]
issue_on_failure = true

[targets."macstudio.macos-arm64-vm"]
description = "Mac Studio Tart macOS ARM64 build VM."
provider = "tartci"
host = "macstudio"
os = "macos"
arch = "arm64"
runs_on_json = ["self-hosted", "macOS", "ARM64", "pulp-build", "pulp-build-vm"]

