schema = 1
name = "m1-macos-fleet"

# This file describes staged capacity, not activation. Rendering it neither
# changes the durable pool-off state nor loads a LaunchAgent.
[host]
id = "m1"
# The SSH alias other fleet hosts reach this one by (self-update peers).
ssh = "m1"
home = "/Users/danielraffel"
tart_home = "/Users/danielraffel/VMs"
cache_root = "/Users/danielraffel/.cache/pulp-ci"
log_root = "/Users/danielraffel/Library/Logs/tartci"
# M1's concurrent production supervisors have measured transient GitHub App
# calls above the generic 15-second default even though isolated calls finish
# quickly. Preserve the prior live-host margin across immutable generations.
github_api_timeout_seconds = 30

# launchd does not inherit the interactive shell's GitHub App configuration.
# Preserve references only; key and token contents remain private host files.
# m1's lanes wait for a VM lease after claiming a job, so its boot claims
# live about 26 min on average (claim to pre-mint denial, 2026-10-01..04)
# against 4-5 min on the other hosts. Peers count its claims for up to
# the claim TTL rather than their 15 min default (scripts/job_claim.py).
job_claim_max_age_seconds = 1800

# Home-volume admission floor (scripts/home_volume_floor.py): `report` admits
# every VM lease and logs `home_volume_would_refuse` when the home volume is
# below its computed floor. `refuse` denies the new clone instead; flip it only
# after a day of report data shows no false refusals, and with Daniel's OK.
home_volume_floor_mode = "report"
[github_app]
id = "3878000"
private_key_path = "/Users/danielraffel/.config/shipyard/github-apps/shipyard-local.private-key.pem"
cache_dir = "/Users/danielraffel/.config/shipyard/ghapp-cache"

# Canary: guest resolvers pinned to two public anycast resolvers instead of the
# vmnet DHCP one. The DHCP resolver is this host's Tailscale MagicDNS, whose
# only global nameserver is one remote AdGuard node; on 2026-09-28 03:48-03:51Z
# it stopped answering for every fleet host at once and gate VMs failed
# npm/cargo/curl lookups (providers/tart-macos/guest-dns.lib.sh). Fail-open: a
# guest whose lookup does not resolve through these keeps its DHCP resolver.
# Rollback: delete this table.
[guest_network]
dns_servers = ["1.1.1.1", "8.8.8.8"]

[stacked_images]
enabled = false
minimum_macos_major = 27
minimum_tart_version = "2.36.0"
registry_username_file = "/Users/danielraffel/.config/pulp/secrets/ghcr-stackbench-username"
registry_token_file = "/Users/danielraffel/.config/pulp/secrets/ghcr-stackbench-token"
flat_rollback = "pulp-build-runner:latest"

# Opt-in: `tartci reclaim` (hourly) also runs Pulp's own reapers from a fresh
# origin/main checkout of `repo`: clean_build_cov.sh every pass, and
# clean_worktree_builds.sh while the worktrees_root volume is below
# pressure_free_gb. Their merged / idle / not-in-use / lineage gates are the
# safety; tartci adds none and relaxes none (scripts/pulp_reapers.py).
# m1 keeps Pulp worktrees as siblings of the primary checkout on the internal
# disk (the Pulp reapers' own default root there).
# Remove this table to turn it off.
[reclaim]
pulp_worktree_builds = true
repo = "/Users/danielraffel/Code/pulp"
worktrees_root = "/Users/danielraffel/Code"
pressure_free_gb = 200
# Remove finished git checkouts agents left in /private/tmp (48 h idle,
# clean, pushed; orphaned and broken ones are only reported). scripts/tmp_checkouts.py
tmp_checkouts = true
# Finished agent worktrees (clean, pushed, idle 48 h, lineage not active) in
# ~/Code and ~/Code/agent-worktrees (124 finished
# worktrees, 77 GiB, on 2026-10-05). Worktrees only: every plain clone there is kept. scripts/tmp_checkouts.py
extra_worktree_roots = ["/Users/danielraffel/Code", "/Users/danielraffel/Code/agent-worktrees"]
# Remove test and validation scratch from /private/tmp, the per-user temp dir
# and Chrome's code-sign clones (12 h idle, nothing open, no live process
# naming it; 4 h while the boot volume is below its floor). scripts/scratch_dirs.py
scratch_dirs = true
# Evict gate ccache entries unused for 14 days, once a day, only while no VM
# is running or leased (scripts/gate_ccache_trim.py). m1's gate cache held 398k entries and the guard ran out of budget on
# 8-13% of boots. The m5 canary
# (2026-10-03 to 10-09) cut the pre-boot guard's ok-run median from 89 s to
# 11 s and its budget-exhausted share from 57% to 0%, with the per-job hit
# rate held at 99.49% (99.51% before). Rollback: delete this key.
gate_ccache_trim = true

[[lane]]
id = "pulp-gate"
repo = "Generous-Corp/pulp"
runner_group_id = 1
registration_scope = "repository"
golden = "pulp-build-runner:latest"
min_queued_age_seconds = 600
# Fallback lane (docs/assignment-v2-rollout.md): for queued work younger than
# the 600 s rule, boot now when m3 ("studio") has no free, leasable gate slot
# for that class. The 600 s rule stays the upper bound; an unreadable peer
# keeps it. Over 2026-09-26/28, 55 of 287 macOS gate jobs that queued >= 120 s
# met that condition while an m1 slot was free (about 1,060 job-minutes, median
# 8.6 min earlier). m5 is deliberately NOT a preferred host: its supply report
# counts lease fit, not host load, so while m5 is starved (load 179, swap
# 31.5/32 GB) deferring to it would leave young work on the starved host; and
# m5 is unreachable over SSH, which would make every decision "unknown" (hold).
# Rollback: delete this key, re-render, reload.
fallback_preferred_hosts = ["studio"]
assignment_mode = "event-class-v2"
# Pre-clone demand check: before cloning, re-ask the pre-mint question live and
# skip the clone when the selected class is proven empty or a preferred class
# waits; an uncertain scan clones as before. On m3 (2026-10-01..04) it skipped
# 68 clones in 80 h with served jobs rising, and no refused work. Rollback is
# removing this key. See docs/assignment-v2-rollout.md, "Pre-clone demand check".
assignment_pre_clone_demand_check = true
assignment_omit_labels = ["pulp-gate-fast"]
# A full exhaustive tier scan is normally ~20s on this host, but two
# supervisors may overlap. Preserve fail-closed behavior without treating
# healthy serialized GitHub App traffic as blindness.
assignment_scan_timeout_seconds = 180
# The host-global observation lock admits only one scanner. Four workers keep
# Pulp's large live queue exhaustive inside that bounded 180-second owner slot.
assignment_scan_max_workers = 4
# Tier zero has no higher class to preempt it. Reuse only this supervisor's
# recent exhaustive receipt across VM boot instead of repeating the full Pulp
# backlog scan while holding an unregistered VM.
assignment_top_tier_receipt_max_age_seconds = 180
# When the REST scan fails closed, ask the local Shipyard daemon's webhook feed
# whether demand exists before idling blind. It is consulted only after a scan
# failure and can only report presence, so a healthy scan never reaches it and
# a silent feed changes nothing.
assignment_feed_rescue = true
# Canary for the work-conserving idle retarget: a runner unassigned for 120 s
# re-observes both classes and is discarded only when its own class has no
# queued job and the other class has admissible demand. Rollback is removing
# this key. See docs/assignment-v2-rollout.md.
assignment_idle_retarget_seconds = 120
supervisors = 2
labels = ["self-hosted", "macOS", "ARM64", "pulp-build", "pulp-build-vm"]
replaces_launchd_labels = ["com.danielraffel.pulp.tart-runner-macos-gate"]
# Tear a VM down once its guest stops heartbeating for this long; a
# frozen guest otherwise holds the slot until the 2 h job timeout.
guest_heartbeat_stale_seconds = 600
# The queue scan this supervisor runs is latency-sensitive: a Background
# supervisor's GitHub API calls measured materially slower than the same calls
# at normal priority, and every observed scan failure on this lane is a
# per-call timeout rather than the 180s scan budget. Adaptive lets launchd
# promote the supervisor out of the background band. Gate lanes only.
process_type = "Adaptive"
# Release-first slot (docs/assignment-v2-rollout.md, "Release event classes").
# Slot 2 consults both release classes before the gate classes and falls back
# to gate work whenever no release waits; slot 1 keeps gate-first order with
# the release classes after, so idle slot-1 capacity still serves releases.
# The release tiers below serve only jobs carrying a release class label, which
# Pulp appends when PULP_RELEASE_CLASS_TOKENS opts in. Rollback: delete this key
# and the release tiers, re-render, reload slot 2 at an idle boundary.
assignment_slot_tier_order = { 2 = ["pulp-release-tagged", "pulp-release-pr-gate", "pulp-build-merge-group", "pulp-build-pr-head"] }

[[lane.tier]]
label = "pulp-build-merge-group"
workflow = "Build and Test"
runner_group_id = 1

[[lane.tier]]
label = "pulp-build-pr-head"
workflow = "Build and Test"
runner_group_id = 1

[[lane.tier]]
label = "pulp-release-tagged"
workflow = "Release CLI"
runner_group_id = 1

[[lane.tier]]
label = "pulp-release-tagged"
workflow = "Sign and Release"
runner_group_id = 1

[[lane.tier]]
label = "pulp-release-pr-gate"
workflow = "Release-path PR gate"
runner_group_id = 1

[[lane]]
id = "spectr-gate"
repo = "danielraffel/spectr"
runner_group_id = 1
registration_scope = "repository"
golden = "pulp-build-runner:latest"
priority = "vm"
min_queued_age_seconds = 600
labels = ["self-hosted", "macOS", "ARM64", "spectr-build", "spectr-build-vm", "spectr-gate-fast"]
workflows = ["Spectr M5 Product Acceptance"]
replaces_launchd_labels = []
# Tear a VM down once its guest stops heartbeating for this long; a
# frozen guest otherwise holds the slot until the 2 h job timeout.
guest_heartbeat_stale_seconds = 600

[[lane]]
id = "forge-gate"
repo = "Generous-Corp/forge"
runner_group_id = 11
golden = "pulp-build-runner:latest"
chrome_app_dir = "/Applications/Google Chrome.app"
priority = "gate"
min_queued_age_seconds = 0
labels = ["self-hosted", "macOS", "ARM64", "forge-build", "forge-build-vm", "forge-gate-fast"]
# PR runs are surfaced as the trigger workflow; protected-main proofs may invoke
# the reusable callee directly. Watch both names on the same runner contract.
workflows = ["build", "protected macOS build"]
# The macOS-27 stackbench credential is registry-only. JIT registration stays
# on the default Shipyard App route; do not repurpose registry credentials.
replaces_launchd_labels = ["com.danielraffel.forge.tart-runner-macos"]
# Tear a VM down once its guest stops heartbeating for this long; a
# frozen guest otherwise holds the slot until the 2 h job timeout.
guest_heartbeat_stale_seconds = 600

[[lane]]
id = "vellum-gate"
repo = "Generous-Corp/vellum"
runner_group_id = 8
golden = "pulp-build-runner:latest"
priority = "gate"
min_queued_age_seconds = 600
labels = ["self-hosted", "macOS", "ARM64", "vellum-build-macos", "vellum-host-m1"]
workflows = ["Locked macOS GPU proof", "README clean release proof"]
replaces_launchd_labels = ["com.danielraffel.vellum.tart-runner-macos"]
# Tear a VM down once its guest stops heartbeating for this long; a
# frozen guest otherwise holds the slot until the 2 h job timeout.
guest_heartbeat_stale_seconds = 600

# The support LaunchAgents this host carries (scripts/support_agents.py).
# Self-update renders and compares them after every update; with bootstrap =
# false it only reports, and installs or changes nothing.
# The watchdog's frozen-lane threshold. 4500 s outlasts a gate job's longest
# silent stretch; the 1800 default healed live supervisors (#191). It lived
# only on hand-edited plists until it moved here (#195).
[launchd_watchdog]
stale_log_seconds = 4500

[support_agents]
declared = ["reclaim", "artifact-cache-refresh", "keychain-unlock", "reuse-canary", "launchd-watchdog", "reap"]
bootstrap = false

# The reuse canary (scripts/reuse_canary.py): this host's Shipyard runs in
# shadow_compare mode, so a daily mac run at origin/main keeps a bindable reuse
# record. The agent is declared by this table.
[reuse_canary]
enabled = true
repo = "/Users/danielraffel/Code/pulp"
worktrees_root = "/Users/danielraffel/Code"
