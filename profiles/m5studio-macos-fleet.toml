# m5studio (Daniels-M5-Studio, M5 Ultra 30c/256G). Derived 2026-09-28 from M3's live
# profile. Since 2026-10-01 the Tart store, the Pulp checkout and agent worktrees
# live on the external 4 TB APFS volume /Volumes/Atelier (owners disabled, not
# encrypted), the same shape as M3's /Volumes/Workshop under a different volume
# name. cache_root and log_root stay on the internal disk, as on M3. See
# pulp-planning 2026-09-28-m5studio-host-bringup-plan.md §9.
schema = 1
name = "m5studio-macos-fleet"

# Shipyard's durable host tag for this host is `m5studio`; install authority is
# bound to that exact live tag.
[host]
id = "m5studio"
# The SSH alias other fleet hosts reach this one by (self-update peers).
ssh = "m5s"
home = "/Users/danielraffel"
tart_home = "/Volumes/Atelier/VMs"
cache_root = "/Users/danielraffel/.cache/pulp-ci"
log_root = "/Users/danielraffel/Library/Logs/tartci"
# Measured 2026-09-21: of 209 assignment-scan failures on this host in 24h,
# 184 (88%) were a single GitHub call exceeding the generic 15-second default,
# versus 4 (1.9%) attributable to the scan budget. m1, which already sets 30,
# shows the inverse split. The calls are not slow in isolation; they exceed 15s
# under concurrent supervisors, which is exactly the case this knob exists for.
github_api_timeout_seconds = 30
# Agent core floor (canary). On 2026-09-24/25 about two thirds of this host's
# tartci-governed builds (63 of 95) were denied and fell to a leaseless -j2
# while the gate reserve sat idle. A denied non-gate build that asks with
# `leases acquire --allow-floor` now gets up to 6 cores at background QoS; the
# floor lease is not charged against gate, VM or other build admission, and
# the pool is clamped to unleased memory. Remove these lines to go back.
# 2026-09-30: raised 6 -> 10 (the memory clamp on this host: 16 GiB unleased /
# 1.5 GiB per job) and moved from background to utility QoS. Background QoS
# also throttles disk I/O and biases work to the slower core tier; floor builds
# here took 6-8 minutes per file while two gate VMs used 2.5-4.2 of their 24
# leased cores. Utility still yields to the gate VMs, which run at default QoS.
agent_floor_cores = 10
agent_floor_qos = "utility"

# Daniel-only external-volume execution. The stable Developer-ID identity is
# the TCC responsible process (Full Disk Access / Removable Volumes for
# /Volumes/Atelier); public/home-backed profiles do not inherit it. The
# approval digest is this host's own, written by scripts/build_macos_launcher.sh.
# Home-volume admission floor (scripts/home_volume_floor.py): `report` admits
# every VM lease and logs `home_volume_would_refuse` when the home volume is
# below its computed floor. `refuse` denies the new clone instead; flip it only
# after a day of report data shows no false refusals, and with Daniel's OK.
home_volume_floor_mode = "report"
[launch_helper]
path = "/Users/danielraffel/.local/libexec/TartCILauncher.app"
approval_sha256_path = "/Users/danielraffel/.config/tartci/m5studio-launcher-approved.sha256"
identifier = "com.danielraffel.tartci.launcher"
team_id = "95CX6P84C4"

[stacked_images]
enabled = false
minimum_macos_major = 27
minimum_tart_version = "2.36.0"
registry_username_file = "/Users/danielraffel/.config/pulp/secrets/ghcr-stackbench-username"
registry_token_file = "/Users/danielraffel/.config/pulp/secrets/ghcr-stackbench-token"
flat_rollback = "pulp-build-runner:latest"

# Opt-in: `tartci reclaim` (hourly) also runs Pulp's own reapers from a fresh
# origin/main checkout of `repo`: clean_build_cov.sh every pass, and
# clean_worktree_builds.sh while the worktrees_root volume is below
# pressure_free_gb. Their merged / idle / not-in-use / lineage gates are the
# safety; tartci adds none and relaxes none (scripts/pulp_reapers.py).
# m5studio keeps its Pulp checkout and worktrees on Atelier, beside the Tart
# store, as m3 does on Workshop. On m3 that volume filled on 2026-09-27: 19 GiB
# free, every gate VM lease refused disk_capacity_exceeded for ~6 h, while
# 1,330 GB sat in 40 merged worktrees' build dirs that only Pulp's own reaper
# can prove dead. Remove this table to turn it off.
[reclaim]
pulp_worktree_builds = true
repo = "/Volumes/Atelier/Code/pulp"
worktrees_root = "/Volumes/Atelier/Code/agent-worktrees"
pressure_free_gb = 200
# Remove finished git checkouts agents left in /private/tmp (48 h idle,
# clean, pushed; orphaned and broken ones are only reported). scripts/tmp_checkouts.py
tmp_checkouts = true
# Finished agent worktrees (clean, pushed, idle 48 h, lineage not active) in
# the internal ~/Code, where agents kept making
# worktrees of an old primary checkout after the worktree root moved to Atelier
# (71 finished worktrees, 548 GiB, on 2026-10-05). Worktrees only: every plain clone there is kept. scripts/tmp_checkouts.py
extra_worktree_roots = ["/Users/danielraffel/Code"]
# Remove test and validation scratch from /private/tmp, the per-user temp dir
# and Chrome's code-sign clones (12 h idle, nothing open, no live process
# naming it; 4 h while the boot volume is below its floor). scripts/scratch_dirs.py
scratch_dirs = true
# Evict gate ccache entries unused for 14 days, once a day, only while no VM
# is running or leased (scripts/gate_ccache_trim.py). m5studio's cache is small since its old entries were removed on
# 2026-10-04; this keeps it from growing back to m3's and m1's size. The m5 canary
# (2026-10-03 to 10-09) cut the pre-boot guard's ok-run median from 89 s to
# 11 s and its budget-exhausted share from 57% to 0%, with the per-job hit
# rate held at 99.49% (99.51% before). Rollback: delete this key.
gate_ccache_trim = true

[[lane]]
id = "pulp-gate"
repo = "Generous-Corp/pulp"
runner_group_id = 1
registration_scope = "repository"
golden = "pulp-build-runner:latest"
# 8, not 12: two 12-core gate VMs leased 24 of 28 cores and left agent builds the
# background-QoS floor (6-8 min per file). 2 x 8 = the 16-core gate reserve.
vm_cores = 8
min_queued_age_seconds = 0
assignment_mode = "event-class-v2"
# Pre-clone demand check: before cloning, re-ask the pre-mint question live and
# skip the clone when the selected class is proven empty or a preferred class
# waits; an uncertain scan clones as before. On m3 (2026-10-01..04) it skipped
# 68 clones in 80 h with served jobs rising, and no refused work. Rollback is
# removing this key. See docs/assignment-v2-rollout.md, "Pre-clone demand check".
assignment_pre_clone_demand_check = true
assignment_omit_labels = ["pulp-gate-fast"]
assignment_scan_timeout_seconds = 180
assignment_scan_max_workers = 4
supervisors = 2
labels = ["self-hosted", "macOS", "ARM64", "pulp-build", "pulp-build-vm"]
replaces_launchd_labels = []
# Tear a VM down once its guest stops heartbeating for this long; a
# frozen guest otherwise holds the slot until the 2 h job timeout.
guest_heartbeat_stale_seconds = 600
# The queue scan this supervisor runs is latency-sensitive: a Background
# supervisor's GitHub API calls measured materially slower than the same calls
# at normal priority, and every observed scan failure on this lane is a
# per-call timeout rather than the 180s scan budget. Adaptive lets launchd
# promote the supervisor out of the background band. Gate lanes only.
process_type = "Adaptive"
# Work-conserving idle retarget (trial, both slots): a runner unassigned for
# 120 s re-observes both classes and is discarded only when its own class has
# no queued job and the other class has admissible demand. It composes with the
# slot-2 order below: the runner's own class is resolved by configured tier
# index, and after a discard the supervisor re-selects in that slot's order.
# Rollback is removing this key. See docs/assignment-v2-rollout.md.
assignment_idle_retarget_seconds = 120
# Per-slot class order (docs/assignment-v2-rollout.md, "Per-slot class
# preference" and "Release event classes"). Slot 2 keeps merge-group ahead of
# PR-head so a queued merge group is selected before ordinary PR checks; releases follow
# the gate classes there. Slot 1 is this host's release-first slot: both
# release classes before the gate classes, falling back to gate work whenever
# no release waits. The release tiers below serve only jobs carrying a release
# class label, which Pulp appends when PULP_RELEASE_CLASS_TOKENS opts in.
# Rollback: delete the slot-1 entry and the release tiers (restore slot 2 to
# the two gate classes), re-render, reload both slots at an idle boundary.
assignment_slot_tier_order = { 1 = ["pulp-release-tagged", "pulp-release-pr-gate", "pulp-build-merge-group", "pulp-build-pr-head"], 2 = ["pulp-build-merge-group", "pulp-build-pr-head", "pulp-release-tagged", "pulp-release-pr-gate"] }

[[lane.tier]]
label = "pulp-build-merge-group"
workflow = "Build and Test"
runner_group_id = 1

[[lane.tier]]
label = "pulp-build-pr-head"
workflow = "Build and Test"
runner_group_id = 1

[[lane.tier]]
label = "pulp-release-tagged"
workflow = "Release CLI"
runner_group_id = 1

[[lane.tier]]
label = "pulp-release-tagged"
workflow = "Sign and Release"
runner_group_id = 1

[[lane.tier]]
label = "pulp-release-pr-gate"
workflow = "Release-path PR gate"
runner_group_id = 1

[[lane]]
id = "spectr-gate"
repo = "danielraffel/spectr"
runner_group_id = 1
registration_scope = "repository"
golden = "pulp-build-runner:latest"
priority = "gate"
min_queued_age_seconds = 0
labels = ["self-hosted", "macOS", "ARM64", "spectr-build", "spectr-build-vm", "spectr-gate-fast"]
workflows = ["Spectr M5 Product Acceptance"]
replaces_launchd_labels = []
# Tear a VM down once its guest stops heartbeating for this long; a
# frozen guest otherwise holds the slot until the 2 h job timeout.
guest_heartbeat_stale_seconds = 600

[[lane]]
id = "forge-gate"
repo = "Generous-Corp/forge"
runner_group_id = 11
golden = "pulp-build-runner:latest"
chrome_app_dir = "/Applications/Google Chrome.app"
priority = "gate"
min_queued_age_seconds = 0
labels = ["self-hosted", "macOS", "ARM64", "forge-build", "forge-build-vm", "forge-gate-fast"]
# PR runs are surfaced as the trigger workflow; protected-main proofs may invoke
# the reusable callee directly. Watch both names on the same runner contract.
workflows = ["build", "protected macOS build"]
replaces_launchd_labels = []
# Tear a VM down once its guest stops heartbeating for this long; a
# frozen guest otherwise holds the slot until the 2 h job timeout.
guest_heartbeat_stale_seconds = 600

[[lane]]
id = "vellum-gate"
repo = "Generous-Corp/vellum"
runner_group_id = 8
golden = "pulp-build-runner:latest"
priority = "gate"
min_queued_age_seconds = 0
labels = ["self-hosted", "macOS", "ARM64", "vellum-build-macos", "vellum-host-m5studio"]
workflows = ["Locked macOS GPU proof", "README clean release proof"]
replaces_launchd_labels = []
# Tear a VM down once its guest stops heartbeating for this long; a
# frozen guest otherwise holds the slot until the 2 h job timeout.
guest_heartbeat_stale_seconds = 600

# The support LaunchAgents this host carries (scripts/support_agents.py).
# Self-update renders and compares them after every update; with bootstrap =
# false it only reports, and installs or changes nothing.
# The watchdog's frozen-lane threshold. 4500 s outlasts a gate job's longest
# silent stretch; the 1800 default healed live supervisors (#191). It lived
# only on hand-edited plists until it moved here (#195).
[launchd_watchdog]
stale_log_seconds = 4500

[support_agents]
declared = ["reclaim", "artifact-cache-refresh", "keychain-unlock", "launchd-watchdog", "reap"]
# Converge only the VM janitor; every other declared agent stays plan-only.
bootstrap = ["reap"]
