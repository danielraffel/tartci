schema = 1
name = "m5-macos-fleet"

[host]
id = "m5"
# The SSH alias other fleet hosts reach this one by (self-update peers).
ssh = "m5"
home = "/Users/danielraffel"
tart_home = "/Users/danielraffel/VMs"
cache_root = "/Users/danielraffel/.cache/pulp-ci"
log_root = "/Users/danielraffel/Library/Logs/tartci"
# Measured 2026-09-21: of 263 assignment-scan failures on this host in 24h,
# 213 (81%) were a single GitHub call exceeding the generic 15-second default,
# against 28 lock timeouts. Same shape as m3. The calls are not slow in
# isolation; they exceed 15s under concurrent supervisors.
github_api_timeout_seconds = 30
# Agent core floor, as on m3. m5 has 6 non-gate cores, and one 6-core VM or
# one governed build holds all of them, so every other agent build fell to a
# leaseless -j2: on 2026-09-25..27, 196 governed builds ran `floor` at -j2
# against 70 that got a lease (Shipyard metrics, routing_decision). A denied
# non-gate build that asks with `leases acquire --allow-floor` now gets up to 6
# cores at background QoS; floor leases are not charged against gate, VM or
# build admission, and the pool is clamped to unleased memory (6 on this host).
# Remove this line to go back.
agent_floor_cores = 6
# No persistent runners: the pulp-preamble-m5 runner was unconfigured and
# crash-looping, and the preamble lane runs GitHub-hosted (PULP_PREAMBLE_RUNS_ON_JSON).
persistent_runner_labels = []

# launchd does not inherit the interactive shell's GitHub App configuration.
# Preserve references only; key and token contents remain private host files.
# Home-volume admission floor (scripts/home_volume_floor.py): `report` admits
# every VM lease and logs `home_volume_would_refuse` when the home volume is
# below its computed floor. `refuse` denies the new clone instead; flip it only
# after a day of report data shows no false refusals, and with Daniel's OK.
home_volume_floor_mode = "report"
[github_app]
id = "3878000"
private_key_path = "/Users/danielraffel/.config/shipyard/github-apps/shipyard-local.private-key.pem"
cache_dir = "/Users/danielraffel/.config/shipyard/ghapp-cache"

[stacked_images]
enabled = false
minimum_macos_major = 27
minimum_tart_version = "2.36.0"
registry_username_file = "/Users/danielraffel/.config/pulp/secrets/ghcr-stackbench-username"
registry_token_file = "/Users/danielraffel/.config/pulp/secrets/ghcr-stackbench-token"
flat_rollback = "pulp-build-runner:latest"

# Opt-in: `tartci reclaim` (hourly) also runs Pulp's own reapers from a fresh
# origin/main checkout of `repo`: clean_build_cov.sh every pass, and
# clean_worktree_builds.sh while the worktrees_root volume is below
# pressure_free_gb. Their merged / idle / not-in-use / lineage gates are the
# safety; tartci adds none and relaxes none (scripts/pulp_reapers.py).
# m5 keeps Pulp worktrees as siblings of the primary checkout on the internal
# disk (the Pulp reapers' own default root there).
# Remove this table to turn it off.
[reclaim]
pulp_worktree_builds = true
repo = "/Users/danielraffel/Code/pulp"
worktrees_root = "/Users/danielraffel/Code"
pressure_free_gb = 200
# Remove finished git checkouts agents left in /private/tmp (48 h idle,
# clean, pushed; orphaned and broken ones are only reported). scripts/tmp_checkouts.py
tmp_checkouts = true
# Finished agent worktrees (clean, pushed, idle 48 h, lineage not active) in
# ~/Code, beside the primary checkouts. Worktrees only: every plain clone there is kept. scripts/tmp_checkouts.py
extra_worktree_roots = ["/Users/danielraffel/Code"]
# Remove test and validation scratch from /private/tmp, the per-user temp dir
# and Chrome's code-sign clones (12 h idle, nothing open, no live process
# naming it; 4 h while the boot volume is below its floor). scripts/scratch_dirs.py
scratch_dirs = true
# Evict gate ccache entries unused for 14 days, once a day, only while
# no VM is running or leased (scripts/gate_ccache_trim.py). m5's gate cache held
# 506k entries, 70% unused for 14 days, and the pre-boot guard that stats every
# entry took 87-185 s per boot. The gate's per-job hit rate is 99.5% on every
# host, m5s included from a 25k-entry cache, so the window keeps about five
# days of working set. The canary here (2026-10-03 to 10-09) took the guard's
# ok-run median from 89 s to 11 s at the same hit rate, and the trim is now on
# every macOS fleet host. Rollback: delete this key.
gate_ccache_trim = true

# Canary: rank waiting VM lanes by the lease priority they already carry
# (scripts/leases.py). Six VM lanes share this host's one free 6-core VM slot
# while an agent build holds the non-gate share, and today the first acquire
# wins: on 2026-09-27 forge and a merge-group clone beat slot 2 after it had
# already claimed its job. With this on, an acquire is deferred while a
# strictly higher-priority waiter that fits now would no longer fit; ties stay
# first-come and agent builds are untouched. Rollback: delete this table.
# See docs/assignment-v2-rollout.md, "Ranked VM lease waiters".
[leases]
# Canary: ranked VM lease waiters on for m5 (baseline window 2026-09-27T09:03Z
# to 2026-09-28T08:07Z: 1 inversion in 12 contended hours, 78 acquires).
rank_vm_waiters = true

[[lane]]
id = "pulp-gate"
repo = "Generous-Corp/pulp"
runner_group_id = 1
registration_scope = "repository"
golden = "pulp-build-runner:latest"
min_queued_age_seconds = 0
assignment_mode = "event-class-v2"
assignment_omit_labels = ["pulp-gate-fast"]
# Two Pulp supervisors can overlap exhaustive GitHub App scans. Retain the
# bounded M1 margin rather than treating healthy serialized traffic as blind.
assignment_scan_timeout_seconds = 180
assignment_scan_max_workers = 4
# Work-conserving idle retarget (trial, after m1 and m3): a runner unassigned
# for 120 s re-observes both classes and is discarded only when its own class
# has no queued job and the other class has admissible demand. Rollback is
# removing this key. See docs/assignment-v2-rollout.md.
assignment_idle_retarget_seconds = 120
supervisors = 2
# Each slot's VM is sized from m5's live gate reserve: the largest core count,
# at most vm_pool_cores, at which both slots fit the reserve on cores and
# memory. The vm_pool_cores default (2 x 6 against an 8-core reserve) could
# never run both slots beside agent builds, and the doctor reported
# gate_reserve_overcommitted. The reserve itself is untouched; agent cores are
# not taken. See the "Gate-reserve ratchet" entry in docs/runbook.md.
vm_cores_from = "gate-reserve"
labels = ["self-hosted", "macOS", "ARM64", "pulp-build", "pulp-build-vm"]
replaces_launchd_labels = [
  "com.danielraffel.pulp.tart-runner-macos-gate",
  "com.danielraffel.pulp.tart-runner-macos-gate-slot2",
]
# Tear a VM down once its guest stops heartbeating for this long; a
# frozen guest otherwise holds the slot until the 2 h job timeout.
guest_heartbeat_stale_seconds = 600
# The queue scan this supervisor runs is latency-sensitive: a Background
# supervisor's GitHub API calls measured materially slower than the same calls
# at normal priority, and every observed scan failure on this lane is a
# per-call timeout rather than the 180s scan budget. Adaptive lets launchd
# promote the supervisor out of the background band. Gate lanes only.
process_type = "Adaptive"
# Release-first slot (docs/assignment-v2-rollout.md, "Release event classes").
# Slot 2 consults both release classes before the gate classes and falls back
# to gate work whenever no release waits; slot 1 keeps gate-first order. This
# lane is the only registration that can serve either class, so a class ordered
# below the gate classes on every slot is never minted while gate work queues:
# the pre-mint check requires every preferred class to be empty. The release
# tiers below serve only jobs carrying a release class label, which Pulp
# appends when PULP_RELEASE_CLASS_TOKENS opts in. Rollback: delete this key and
# the release tiers, re-render, reload slot 2 at an idle boundary.
assignment_slot_tier_order = { 2 = ["pulp-release-tagged", "pulp-release-pr-gate", "pulp-build-merge-group", "pulp-build-pr-head"] }

[[lane.tier]]
label = "pulp-build-merge-group"
workflow = "Build and Test"
runner_group_id = 1

[[lane.tier]]
label = "pulp-build-pr-head"
workflow = "Build and Test"
runner_group_id = 1

[[lane.tier]]
label = "pulp-release-tagged"
workflow = "Release CLI"
runner_group_id = 1

[[lane.tier]]
label = "pulp-release-tagged"
workflow = "Sign and Release"
runner_group_id = 1

[[lane.tier]]
label = "pulp-release-pr-gate"
workflow = "Release-path PR gate"
runner_group_id = 1

[[lane]]
id = "pulp-release"
repo = "Generous-Corp/pulp"
runner_group_id = 1
registration_scope = "repository"
golden = "pulp-build-runner:latest"
min_queued_age_seconds = 0
supervisors = 1
runner_idle_timeout_seconds = 60
labels = ["self-hosted", "macOS", "ARM64", "pulp-build-vm-release"]
yield_to_workflow = "Build and Test"
# Stop yielding once a release job has been queued 45 min (about 1.5x the gate
# job's upper median), so a steady PR queue cannot starve a release forever.
yield_max_wait_seconds = 2700
yield_to_labels = [
  "self-hosted",
  "macOS",
  "ARM64",
  "pulp-build",
  "pulp-build-vm",
  "pulp-gate-fast",
  "pulp-build-pr-head",
  "pulp-build-merge-group",
]
replaces_launchd_labels = [
  "com.danielraffel.pulp.tart-runner-macos-release",
]
# Tear a VM down once its guest stops heartbeating for this long; a
# frozen guest otherwise holds the slot until the 2 h job timeout.
guest_heartbeat_stale_seconds = 600

[[lane.tier]]
label = "pulp-release-tagged"
workflow = "Release CLI"
runner_group_id = 1

[[lane.tier]]
label = "pulp-release-tagged"
workflow = "Sign and Release"
runner_group_id = 1

[[lane.tier]]
label = "pulp-release-pr-gate"
workflow = "Release-path PR gate"
runner_group_id = 1

[[lane]]
id = "spectr-gate"
repo = "danielraffel/spectr"
runner_group_id = 1
registration_scope = "repository"
golden = "pulp-build-runner:latest"
priority = "gate"
min_queued_age_seconds = 0
labels = ["self-hosted", "macOS", "ARM64", "spectr-build", "spectr-build-vm", "spectr-gate-fast"]
workflows = ["Spectr M5 Product Acceptance"]
replaces_launchd_labels = []
# Tear a VM down once its guest stops heartbeating for this long; a
# frozen guest otherwise holds the slot until the 2 h job timeout.
guest_heartbeat_stale_seconds = 600

[[lane]]
id = "forge-gate"
repo = "Generous-Corp/forge"
runner_group_id = 11
golden = "pulp-build-runner:latest"
chrome_app_dir = "/Applications/Google Chrome.app"
priority = "gate"
min_queued_age_seconds = 0
labels = ["self-hosted", "macOS", "ARM64", "forge-build", "forge-build-vm", "forge-gate-fast"]
# PR runs are surfaced as the trigger workflow; protected-main proofs may invoke
# the reusable callee directly. Watch both names on the same runner contract.
workflows = ["build", "protected macOS build"]
replaces_launchd_labels = []
# Tear a VM down once its guest stops heartbeating for this long; a
# frozen guest otherwise holds the slot until the 2 h job timeout.
guest_heartbeat_stale_seconds = 600

[[lane]]
id = "vellum-gate"
repo = "Generous-Corp/vellum"
runner_group_id = 8
golden = "pulp-build-runner:latest"
priority = "gate"
min_queued_age_seconds = 0
labels = ["self-hosted", "macOS", "ARM64", "vellum-build-macos", "vellum-host-m5"]
workflows = ["Locked macOS GPU proof", "README clean release proof"]
replaces_launchd_labels = []
# Tear a VM down once its guest stops heartbeating for this long; a
# frozen guest otherwise holds the slot until the 2 h job timeout.
guest_heartbeat_stale_seconds = 600

# The support LaunchAgents this host carries (scripts/support_agents.py).
# Self-update renders and compares them after every update; with bootstrap =
# false it only reports, and installs or changes nothing.
# The watchdog's frozen-lane threshold. 4500 s outlasts a gate job's longest
# silent stretch; the 1800 default healed live supervisors (#191). It lived
# only on hand-edited plists until it moved here (#195).
[launchd_watchdog]
stale_log_seconds = 4500

[support_agents]
declared = ["reclaim", "artifact-cache-refresh", "keychain-unlock", "launchd-watchdog", "reap"]
bootstrap = false
