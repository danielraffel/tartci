# Pulp — macOS build lane (Tart, ARM64 guest). The golden is a layered macOS
# runner image with Xcode, Homebrew build tools, a rustup-managed Rust 1.97.1
# toolchain (cargo/rustc for the release-cli lane), actions-runner, baked Skia,
# and env parity for the stock Build and Test workflow.

schema   = 2
name     = "pulp-build-runner"
provider = "tart"
strategy = "bake"
os       = "macos"
arch     = "arm64"
cross    = false

base = "ghcr.io/cirruslabs/macos-golden-gate-base@sha256:4859ea9483a1f6e377301f23a5243798044266a373fc36635e9dcd045e09292f"
disk_gb = 150

[source]
repository = "https://github.com/Generous-Corp/pulp"
commit     = "c368b19e47e334be8a29c59e7108794a5570e3f2"
manifest   = "tools/deps/manifest.json"

[toolchain]
macos_build = "26B123"
macos = "27.2"
xcode_build = "27B52"
clang_format = "21.1.8"
tart = "2.38.0"
rust_targets = ["x86_64-apple-darwin"]
rust = "1.97.1"
node = "26.10.0"
python = "3.14.4"
ninja = "1.13.2"
cmake = "4.3.3"
xcode = "27.2"

[brew]
packages = [
  "git",
  "git-lfs",
  "gh",
  "rsync",
  "ccache",
  "jq",
  "coreutils",
  "tailscale",
  "cmake",
  "ninja",
  "node",
  "python@3.12",
  "rustup",
  "clang-format",
]
# Homebrew's `rustup` is keg-only. The bake must run `rustup default 1.97.1`,
# add the Darwin target, and expose ~/.cargo/bin. clang-format is required:
# without it, the pulp fmt shell-out test hangs until its timeout.

# BEGIN GENERATED PULP TOOLCHAIN (tools/toolchain/manifest.toml)
# source_sha256 = 7b695d2cbaf8c4a0eb572c673416b76cd728c23ef50c4126ffb0f621d7926959
# generated_platform = macos
# END GENERATED PULP TOOLCHAIN

[skia]
release = "chrome/m153"
variant = "darwin-arm64-gpu"
path    = "/Users/admin/pulp-skia-build"

[v8]
disposition = "baked-provider-only"
variant     = "darwin-arm64"

[golden_readiness]
# TartCI does not yet have a receipt-backed consumer that can prove an existing
# macOS golden contains this exact source/provider generation. Keep this
# explicitly unready: list/resize/tag are inventory operations, not m153 proof.
status = "unready"
reason = "requires receipt-backed exact-golden verification before promotion"

[caches]
# Pulp's current macOS full build is cache-dominated. Five GiB churned the
# shared cache close to its ceiling during ordinary merge-group traffic and
# discarded useful objects between exact heads. Forty GiB matches the Linux
# lane while remaining bounded on the smallest participating Mac.
ccache_max = "40G"

[mounts]
ccache          = "${TARTCI_CACHE}/pulp/ccache"
fetchcontent    = "${TARTCI_CACHE}/pulp/fetchcontent-src"

[run]
configure = "cmake -S ~/src -B ~/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPULP_BUILD_TESTS=ON -DPULP_BUILD_EXAMPLES=ON"
build     = "cmake --build ~/build --parallel $(sysctl -n hw.ncpu)"
test      = "ctest --test-dir ~/build --output-on-failure --exclude-regex AudioWorkgroup --label-exclude slow"

[runner]
golden          = "pulp-build-runner:latest"
pilot_labels    = "self-hosted,macOS,ARM64,pulp-build-vm"
required_labels = "self-hosted,macOS,ARM64,pulp-build"
workflow_name   = "Build and Test"
vm_cap          = 2
idle_timeout_s  = 900
job_warn_s      = 5400
job_timeout_s   = 7200
