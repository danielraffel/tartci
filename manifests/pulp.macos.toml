# Pulp — macOS build lane (Tart, ARM64 guest). The golden is a layered macOS
# runner image with Xcode, Homebrew build tools, a rustup-managed stable Rust
# toolchain (cargo/rustc for the release-cli lane), actions-runner, baked Skia,
# and env parity for the stock Build and Test workflow.

schema   = 2
name     = "pulp-build-runner"
provider = "tart"
strategy = "bake"
os       = "macos"
arch     = "arm64"
cross    = false

base    = "ghcr.io/cirruslabs/macos-tahoe-base:latest"
disk_gb = 150

[source]
repository = "https://github.com/Generous-Corp/pulp"
commit     = "21fbc9da9214d4e6279fa2e8b4e70df9bed8662a"
manifest   = "tools/deps/manifest.json"

[toolchain]
xcode  = "26.5"
cmake  = "homebrew"
ninja  = "homebrew"
python = "3.12"
rust   = "stable"   # rustup-managed; release-cli.yml builds the Rust `pulp` CLI
rust_targets = ["x86_64-apple-darwin"] # release-cli's Darwin Intel cross-build

[brew]
# Homebrew's `rustup` is keg-only and does not provide `rustup-init`. The bake
# must run `rustup default stable`, add `rust_targets`, and expose the keg's
# proxies through ~/.cargo/bin. The exact verified recipe is in docs/runbook.md.
# The `stable` pin matches Pulp's experimental/pulp-rs/rust-toolchain.toml, so
# there's no reproducibility drift vs. the workflow fallback. release-cli.yml
# keeps a run-time rustup bootstrap as the portability belt; baking it here just
# skips the ~30-60s per-run install on steady-state release runs.
packages = [
  "git",
  "git-lfs",
  "gh",
  "rsync",
  "ccache",
  "jq",
  "cmake",
  "ninja",
  "node",
  "python@3.12",
  "rustup",
  # clang-format for the `pulp fmt` CLI. Without it on PATH, the Build-and-Test
  # gate's `pulp fmt` shell-out tests (test_cli_fmt_shellout.cpp) HANG and hit
  # their 10s timeout on this VM golden (r.timed_out) rather than exercising the
  # formatter — reddening the required macOS leg. The Homebrew `clang-format`
  # formula installs a standalone `clang-format` binary (no full LLVM needed).
  "clang-format",
]

[skia]
release = "chrome/m153"
variant = "darwin-arm64-gpu"
path    = "/Users/admin/pulp-skia-build"

[v8]
disposition = "baked-provider-only"
variant     = "darwin-arm64"

[golden_readiness]
# TartCI does not yet have a receipt-backed consumer that can prove an existing
# macOS golden contains this exact source/provider generation. Keep this
# explicitly unready: list/resize/tag are inventory operations, not m153 proof.
status = "unready"
reason = "requires receipt-backed exact-golden verification before promotion"

[caches]
# Pulp's current macOS full build is cache-dominated. Five GiB churned the
# shared cache close to its ceiling during ordinary merge-group traffic and
# discarded useful objects between exact heads. Forty GiB matches the Linux
# lane while remaining bounded on the smallest participating Mac.
ccache_max = "40G"

[mounts]
ccache          = "${TARTCI_CACHE}/pulp/ccache"
fetchcontent    = "${TARTCI_CACHE}/pulp/fetchcontent-src"

[run]
configure = "cmake -S ~/src -B ~/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPULP_BUILD_TESTS=ON -DPULP_BUILD_EXAMPLES=ON"
build     = "cmake --build ~/build --parallel $(sysctl -n hw.ncpu)"
test      = "ctest --test-dir ~/build --output-on-failure --exclude-regex AudioWorkgroup --label-exclude slow"

[runner]
golden          = "pulp-build-runner:latest"
pilot_labels    = "self-hosted,macOS,ARM64,pulp-build-vm"
required_labels = "self-hosted,macOS,ARM64,pulp-build"
workflow_name   = "Build and Test"
vm_cap          = 2
idle_timeout_s  = 900
job_warn_s      = 5400
job_timeout_s   = 7200
