# vm-image manifest (schema v2) — WORKED x86_64 / CROSS example.
#
# A Linux lane whose authoritative ship target is x86_64, reached on an ARM64
# Apple-Silicon host by cross-compiling in-guest and running TESTS under
# Rosetta-for-Linux. This is a SMOKE / debug signal — a first line of defense for
# atomics, SIMD/Highway codegen, and behavior that differs across ISAs — NOT a
# gate. GitHub-hosted x64 (ubuntu-latest) stays the authoritative x64 gate.
#
# Drive it with: `tartci up linux --target-arch x86_64`  (GPU off by default).
# Prove just the toolchain+emulator chain (golden-agnostic, no Pulp checkout):
#            `tartci up linux --target-arch x86_64 --self-test`.

schema      = 2
name        = "example-linux-x64-smoke"
provider    = "tart"                 # tart=linux/macos guest (ARM64), qemu=windows
strategy    = "configure-on-boot"

os          = "linux"
arch        = "arm64"                # GUEST arch — Apple Virtualization is ARM64-only.
target_arch = "x86_64"              # what you ultimately ship/gate on.
cross       = true                   # target_arch != arch ⇒ cross + emulate.

base    = "ghcr.io/cirruslabs/ubuntu:24.04"
disk_gb = 90

[toolchain]
cmake  = "system"
ninja  = "system"
python = "3.12"

[apt]
# Native build deps PLUS the x86_64 cross toolchain, Rosetta binfmt support, and
# amd64 userland for dynamic x64 binaries. The default `--target-arch x86_64`
# run is GPU-off to keep that surface small; if a lib is missing the cross
# configure/link fails loudly rather than silently emitting an arm64 artifact.
packages = [
  "build-essential", "cmake", "ninja-build", "git", "pkg-config", "ccache",
  "python3", "python3-pip",
  "gcc-x86-64-linux-gnu", "g++-x86-64-linux-gnu",   # the cross compiler
  "binfmt-support",
  "libc6:amd64", "libstdc++6:amd64", "libgcc-s1:amd64",
  "zlib1g:amd64", "libtinfo6:amd64", "libxml2:amd64",
]

# No [skia] baked here: the cross smoke lane builds GPU-off. GPU-on cross needs a
# SEPARATE x64 Skia tree (both Linux arches collide on one libskia.a path — see
# docs/gotchas.md), passed via `--skia-dir` / [emulation].skia_dir.

[emulation]
emulator    = "rosetta"            # rosetta (Linux default) | qemu-user (fallback)
toolchain   = "x86_64-linux-gnu"   # cross compiler prefix → gcc/g++-x86-64-linux-gnu
gpu         = false                # set true ONLY with an explicit x64 skia_dir below
skia_dir    = ""                   # e.g. "$HOME/skia-x64" containing build/linux-gpu/lib/Release/libskia.a
test_labels = "unit"               # ctest subset safe to emulate (excludes sanitizer/simd/gpu/timing)

[caches]
ccache_max = "40G"

[run]
deps      = "./setup.sh --ci --deps-only"
# These mirror the native contract; the provider injects the cross compilers
# (-DCMAKE_C_COMPILER=x86_64-linux-gnu-gcc, …) and -DCMAKE_SYSTEM_PROCESSOR=x86_64
# when target_arch != arch, then runs ctest under Rosetta binfmt.
configure = "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -G Ninja -DPULP_ENABLE_GPU=OFF"
build     = "cmake --build build -j"
test      = "ctest --test-dir build --output-on-failure --label-exclude 'sanitizer|simd|gpu|timing'"
