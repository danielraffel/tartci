# Pulp — Linux build lane (Tart, ARM64 guest). PROVEN: Release build green +
# ctest ~99% + warm host-mounted ccache (2026-06). x86_64 is reached by
# cross-compile + Rosetta-for-Linux for test execution; GitHub-hosted ubuntu-latest
# stays the authoritative x64 gate.

schema      = 2
name        = "pulp-linux-build"
provider    = "tart"
strategy    = "bake"
os          = "linux"
arch        = "arm64"
target_arch = "x86_64"
cross       = true

base    = "ghcr.io/cirruslabs/ubuntu:24.04"   # pinned 24.04; bump deliberately
disk_gb = 90

[source]
repository = "https://github.com/Generous-Corp/pulp"
commit     = "21fbc9da9214d4e6279fa2e8b4e70df9bed8662a"
manifest   = "tools/deps/manifest.json"

# BEGIN GENERATED PULP TOOLCHAIN (tools/toolchain/manifest.toml)
# source_sha256 = 09bfe44e0d65d4187eb20203b5f6e833a4fd0f10e4dd252b56e7dc0e7cd99b4f
# generated_platform = linux
[toolchain]
cmake = "system"
python = "3.12"
node = "26.10.0"
rust_targets = ["x86_64-apple-darwin"]

[apt]
packages = [
  "build-essential",
  "cmake",
  "ninja-build",
  "git",
  "pkg-config",
  "ccache",
  "python3",
  "python3-pip",
  "libicu-dev",
  "libegl1-mesa-dev",
  "libgbm-dev",
  "libdrm-dev",
  "libx11-dev",
  "libxext-dev",
  "libxrandr-dev",
  "libxcursor-dev",
  "libxi-dev",
  "libxinerama-dev",
  "libwayland-dev",
  "libxkbcommon-dev",
  "libasound2-dev",
  "libpulse-dev",
  "gcc-x86-64-linux-gnu",
  "g++-x86-64-linux-gnu",
  "binfmt-support",
  "libc6:amd64",
  "libstdc++6:amd64",
  "libgcc-s1:amd64",
  "zlib1g:amd64",
  "libtinfo6:amd64",
  "libxml2:amd64",
]
# END GENERATED PULP TOOLCHAIN

[skia]
release = "chrome/m153"
variant = "linux-arm64-gpu"   # baked into the golden so configure is offline

[v8]
disposition = "baked-provider-only"
variant     = "linux-arm64"

[emulation]
# x86_64 reached via cross-compile + Rosetta-for-Linux. SMOKE only;
# ubuntu-latest on GitHub stays the authoritative x64 gate.
# `tartci up linux --target-arch x86_64` drives this.
emulator    = "rosetta"
toolchain   = "x86_64-linux-gnu"
gpu         = false               # GPU-off (no x64 Skia baked; would collide with arm64 libskia.a)
test_labels = "unit"

[caches]
ccache_max = "40G"

[mounts]
# Host-mounted ccache via virtio-fs (systemd .mount in the golden; survives the
# cloud-init fstab revert). 99.9%-warm on a second build.
ccache = "${TARTCI_CACHE}/pulp/ccache"

[run]
deps      = "./setup.sh --ci --deps-only"
configure = "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -G Ninja"
build     = "cmake --build build -j"
test      = "ctest --test-dir build --output-on-failure"
