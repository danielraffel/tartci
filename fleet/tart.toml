# The Tart every fleet host runs (scripts/tart_pin.py). Moving it is a reviewed
# commit: a host upgrades only with `[tart] upgrade = true` in its
# self-update.toml, only while its pool is off, the canary first, and only when
# the openai/tools tap offers exactly these versions with these formula
# checksums (the sha256 of the release tarball the formula downloads, from
# `brew info --json=v2 openai/tools/tart openai/tools/softnet`). Brew upgrades
# Softnet with Tart, so it is pinned too.

[tart]
version = "2.41.1"
sha256 = "e680a734febccfce7d4e910c1f7f13fc3b00f19a181c945e2d746de3214c32c2"
formula = "openai/tools/tart"

[softnet]
version = "0.24.1"
sha256 = "8ff8ff099c2b5ac1b1128e7999c4a730ac85f486c8a4cb0239eb98432859a0f7"
formula = "openai/tools/softnet"
